stages:
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip

test:
  stage: test
  image: python:3.12-slim
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq tesseract-ocr tesseract-ocr-rus
    - pip install -r requirements-dev.txt
  script:
    - pytest tests/ -v
